<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tu código de Kora</title></head>
<body style="margin:0;padding:0;background:#F8F7FC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1C1928;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F8F7FC;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#FFFFFF;border-radius:20px;padding:32px 28px;">
        <tr><td style="font-size:15px;font-weight:700;letter-spacing:-0.2px;color:#6D42E8;padding-bottom:24px;">Kora</td></tr>
        <tr><td style="font-size:22px;line-height:28px;font-weight:700;letter-spacing:-0.4px;padding-bottom:8px;">Confirma tu correo</td></tr>
        <tr><td style="font-size:15px;line-height:22px;color:#5C586A;padding-bottom:24px;">Escribe este código en la app para activar tu cuenta.</td></tr>
        <tr><td align="center" style="padding-bottom:24px;">
          <div style="display:inline-block;background:#EDE6FF;border-radius:14px;padding:16px 24px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:32px;line-height:36px;font-weight:700;letter-spacing:10px;color:#1C1928;">{{ .Token }}</div>
        </td></tr>
        <tr><td style="font-size:13px;line-height:20px;color:#777383;padding-bottom:4px;">El código vence en 1 hora y sirve una sola vez.</td></tr>
        <tr><td style="font-size:13px;line-height:20px;color:#777383;">Si no creaste una cuenta en Kora, ignora este correo.</td></tr>
      </table>
      <p style="font-size:12px;line-height:18px;color:#9A96A6;margin:16px 0 0;">Nunca te pediremos este código por teléfono ni por chat.</p>
    </td></tr>
  </table>
</body>
</html>
