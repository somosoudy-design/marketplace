# Publishes the current JavaScript and images of the app to EAS Update, channel "preview", so test APKs built with
# expo-updates (APK 4 onward) receive them without reinstalling. Runs when .github/eas-update-request changes on
# the work branch; the first line that is not a comment becomes the update message. Needs the EXPO_TOKEN secret.
# The runtime version (fingerprint of the native code) decides which APKs can take the update.
name: Actualización de prueba (EAS Update)

on:
  push:
    branches: ['claude/marketplace-v1']
    paths: ['.github/eas-update-request']

permissions:
  contents: read

concurrency:
  group: eas-update-preview
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Proyecto Expo y token
        run: node tools/eas/check-project.mjs

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      # The preview profile's variables, the same the APK was built with. eas.json is part of the fingerprint, so a
      # public value added after APK 4 (the published panel) goes in UPDATE_ONLY_ENV until the next APK carries it in
      # eas.json, which then wins.
      - name: Variables del perfil preview (las mismas del APK)
        working-directory: apps/mobile
        env:
          UPDATE_ONLY_ENV: '{"EXPO_PUBLIC_PANEL_URL":"https://kora-panel.expo.app"}'
        run: node -e "const env = { ...JSON.parse(process.env.UPDATE_ONLY_ENV), ...require('./eas.json').build.preview.env }; for (const [k, v] of Object.entries(env)) console.log(k + '=' + v)" >> "$GITHUB_ENV"

      # An update only reaches APKs with the same fingerprint; a native change (icon, splash, a native module) makes
      # it unreachable. The request names the runtime of the installed APKs, and the job stops if it no longer matches.
      - name: Runtime de los APK instalados
        working-directory: apps/mobile
        run: |
          want="$(grep -E '^runtime:' "$GITHUB_WORKSPACE/.github/eas-update-request" | head -1 | awk '{print $2}')"
          have="$(node_modules/.bin/expo-updates fingerprint:generate --platform android | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).hash))")"
          echo "runtime de esta versión: $have"
          if [ -n "$want" ] && [ "$want" != "$have" ]; then
            echo "::error::El runtime cambió ($have, se esperaba $want): algo nativo cambió y la actualización no llegaría a esos APK. Hace falta un APK nuevo."
            exit 1
          fi

      - name: Publicar en el canal preview
        id: update
        working-directory: apps/mobile
        run: |
          msg="$(grep -v '^#' "$GITHUB_WORKSPACE/.github/eas-update-request" | grep -v '^runtime:' | grep -v '^\s*$' | head -1)"
          npx --yes eas-cli@24.12.1 update --channel preview --platform android --message "${msg:-Versión de prueba}" --non-interactive --json > "$GITHUB_WORKSPACE/eas-update.json"

      - name: Resultado
        if: always() && steps.update.outcome != 'skipped'
        run: node tools/eas/update-report.mjs eas-update.json
