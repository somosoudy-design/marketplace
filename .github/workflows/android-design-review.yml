name: Android Mayami - revisión visual local
on:
  push:
    branches: ['claude/marketplace-v1']
    paths: ['.github/android-design-review-request']
permissions:
  contents: read
concurrency:
  group: android-design-review
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Dependencias
        run: pnpm install --frozen-lockfile
      - name: Tipos y lint
        run: |
          pnpm --filter @kora/mobile typecheck
          pnpm --filter @kora/mobile lint
          pnpm exec vitest run tests/mobile/catalog-exhibition.test.ts tests/mobile/store-logo.test.ts
          node --test tools/brand/original-artwork.test.mjs
      - name: Bloquear proyectos alojados
        run: printf '127.0.0.1 mimnotafmfasvwrclxan.supabase.co bfuggvbgttvcygbexqyn.supabase.co\n' | sudo tee -a /etc/hosts > /dev/null
      - name: Stack aislado y configuración local
        run: |
          pnpm stack:start
          bash tools/local-stack/app-env.sh
      - name: Exportación de app web para pruebas
        run: pnpm --filter @kora/mobile export:web
      - name: Navegador
        run: |
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$chrome_bin" ]; then printf 'PW_CHROMIUM_PATH=%s\n' "$chrome_bin" >> "$GITHUB_ENV"; else pnpm --filter @kora/app-e2e exec playwright install --with-deps chromium; fi
      - name: Recorridos y capturas con fixtures locales
        working-directory: tests/app-e2e
        run: pnpm exec playwright test -c playwright-app.config.ts home-v2.spec.ts reference-home.spec.ts design-delivery-01.spec.ts marketplace-composition.spec.ts browse.spec.ts mayami-android-design.spec.ts
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mayami-android-design-${{ github.run_id }}
          path: |
            tests/app-e2e/test-results
            tests/app-e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 30
