# Solo visitante, APK 5 existente: sin cuentas, pedidos, pagos ni escrituras remotas.
# CI usa un emulador descartable; en un dispositivo propio restaurar conexión si se interrumpe el flujo.
appId: com.example.kora.preview
name: Franja sin conexión y encabezado nativo
---
- setAirplaneMode: false
- launchApp
- runFlow:
    when:
      visible: .*isn't responding.*
    commands:
      - tapOn: Wait
- extendedWaitUntil:
    visible:
      id: home-search
    timeout: 60000
- tapOn:
    id: buyer-tab-account
- tapOn:
    id: account-favorites
- extendedWaitUntil:
    visible: Guarda lo que te gusta
    timeout: 15000
- takeScreenshot: offline-01-encabezado-conexion
- setAirplaneMode: true
- extendedWaitUntil:
    visible:
      id: offline-notice
    timeout: 15000
- assertVisible: Guarda lo que te gusta
- takeScreenshot: offline-02-encabezado-sin-conexion
- back
- extendedWaitUntil:
    visible:
      id: account-favorites
    timeout: 15000
- tapOn:
    id: account-favorites
- extendedWaitUntil:
    visible: Guarda lo que te gusta
    timeout: 15000
- assertVisible:
    id: offline-notice
- takeScreenshot: offline-03-encabezado-al-volver
- setAirplaneMode: false
- extendedWaitUntil:
    notVisible:
      id: offline-notice
    timeout: 15000
- assertVisible: Guarda lo que te gusta
- takeScreenshot: offline-04-encabezado-reconexion
- back
- extendedWaitUntil:
    visible:
      id: account-favorites
    timeout: 15000
