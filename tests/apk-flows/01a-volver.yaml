# Volver con el botón o gesto «atrás» de Android desde pantallas abiertas encima de Inicio: la ficha de un producto
# y la de iniciar sesión (campana de un visitante). Debe volver a Inicio, nunca cerrar la app.
# Falla en el APK 4 con Android 13 a 15 (el emulador es Android 15): el APK pide el gesto predictivo y apunta a
# SDK 36, y React Native solo atiende «atrás» en Android 16. Se arregla en el APK 5 (docs/PENDIENTES.md 1.5).
# Corre antes de 02-cuenta: necesita la app sin sesión (la cuenta de 02 queda abierta).
appId: com.example.kora.preview
name: Volver con atrás de Android
---
- launchApp
- runFlow:
    when:
      visible: .*isn't responding.*
    commands:
      - tapOn: Wait
- extendedWaitUntil:
    visible:
      id: home-search
    timeout: 60000

# la campana de un visitante abre iniciar sesión
- tapOn:
    id: home-bell
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: home-search
    timeout: 15000
- takeScreenshot: volver-01-desde-iniciar-sesion

# una ficha abierta desde una tarjeta de Inicio
- scrollUntilVisible:
    element:
      id: product-card-.*
    direction: DOWN
    timeout: 30000
- tapOn:
    id: product-card-.*
- extendedWaitUntil:
    visible:
      id: product-title
    timeout: 30000
- back
- extendedWaitUntil:
    visible:
      id: home-search
    timeout: 15000
- takeScreenshot: volver-02-desde-ficha
